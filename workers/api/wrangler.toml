name = "gigpilot-api"
main = "src/index.ts"
compatibility_date = "2024-05-01"

[vars]
# Production Env Vars
SUPABASE_URL = "https://your-production-supabase-url.supabase.co"
JWT_SECRET = "production-jwt-secret-override-in-cf-dashboard"

# Bind Cloudflare R2 Bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "gp-assets-bucket"
preview_bucket_name = "gp-assets-preview-bucket"
